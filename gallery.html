<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery &mdash; JZ Photography</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Castoro+Titling&family=Montserrat:wght@300;400;500;600&display=swap');

:root {
  --bg: #0a0a0a;
  --ink: #fff;
  --ink-dim: rgba(255,255,255,0.72);
  --line: rgba(255,255,255,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
}
.display { font-family: 'Castoro Titling', serif; font-weight: 400; }

@font-face {
  font-family: 'Ponpewd Signature';
  src: url('fonts/PonpewdSignature.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
.signature { font-family: 'Ponpewd Signature', cursive; font-weight: 400; }

/* social icons */
.social-icons {
  display: flex; align-items: center; justify-content: center;
  gap: 18px;
  margin: 6px 0 20px;
}
.social-icons a {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--ink);
  opacity: 0.82;
  text-decoration: none;
  transition: opacity 0.2s, border-color 0.2s;
}
.social-icons a:hover { opacity: 1; border-color: var(--ink); }
.social-icons svg {
  width: 15px; height: 15px;
  fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}

/* nav */
header.site-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 26px 42px;
  background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
}
header.site-nav .wordmark {
  font-family: 'Castoro Titling', serif;
  font-size: 20px;
  letter-spacing: 0.04em;
  color: var(--ink);
  text-decoration: none;
}
header.site-nav nav { display: flex; gap: 30px; }
header.site-nav nav a {
  color: var(--ink);
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.85;
  transition: opacity 0.2s;
}
header.site-nav nav a:hover, header.site-nav nav a.active { opacity: 1; border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
@media (max-width: 700px) {
  header.site-nav { padding: 18px 20px; }
  header.site-nav nav { gap: 16px; }
  header.site-nav nav a { font-size: 9px; letter-spacing: 0.1em; }
}

footer.site-footer {
  text-align: center;
  padding: 70px 24px 50px;
  border-top: 1px solid var(--line);
  color: var(--ink-dim);
  font-size: 12px;
  letter-spacing: 0.04em;
}
footer.site-footer .wordmark { font-family: 'Castoro Titling', serif; font-size: 18px; color: var(--ink); margin-bottom: 10px; letter-spacing: 0.04em; }
footer.site-footer a { color: var(--ink-dim); text-decoration: none; }
footer.site-footer a:hover { color: var(--ink); }


.gallery-header {
  padding: 150px 24px 40px;
  text-align: center;
}
.gallery-header h1 {
  font-size: clamp(34px, 5vw, 56px);
  letter-spacing: 0.02em;
}
.filters {
  display: flex; flex-wrap: wrap; gap: 10px 26px; justify-content: center;
  padding: 0 24px 50px;
}
.filter-btn {
  background: none; border: none; color: var(--ink-dim);
  font-family: 'Montserrat', sans-serif;
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  cursor: pointer; padding-bottom: 6px; border-bottom: 1px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.filter-btn:hover { color: var(--ink); }
.filter-btn.active { color: var(--ink); border-color: var(--ink); }

main { max-width: 1500px; margin: 0 auto; padding: 0 24px 40px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 4px;
}
.card {
  position: relative; overflow: hidden; cursor: pointer;
  aspect-ratio: 4/3; background: #111;
}
.card.hidden { display: none; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
.card:hover img { transform: scale(1.06); }
.card figcaption {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 30px 14px 12px; font-size: 12px; letter-spacing: 0.03em;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.85));
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.25s, transform 0.25s;
}
.card:hover figcaption { opacity: 1; transform: translateY(0); }

#lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,0.95);
  display: none; align-items: center; justify-content: center;
  z-index: 300; flex-direction: column; padding: 40px;
}
#lightbox.open { display: flex; }
#lightbox img { max-width: 92vw; max-height: 80vh; object-fit: contain; }
#lightbox .caption { margin-top: 18px; color: var(--ink-dim); font-size: 13px; letter-spacing: 0.05em; }
#lightbox .close {
  position: absolute; top: 24px; right: 32px; font-size: 32px; color: var(--ink);
  cursor: pointer; background: none; border: none; line-height: 1;
}
</style>
</head>

<div id="lightbox" onclick="closeLightbox(event)">
  <button class="close" onclick="closeLightbox(event)">&times;</button>
  <img id="lightbox-img" src="" alt="">
  <div class="caption" id="lightbox-caption"></div>
</div>

<script>
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    var f = btn.dataset.filter;
    document.querySelectorAll('.card').forEach(function(card) {
      card.classList.toggle('hidden', f !== 'all' && card.dataset.cat !== f);
    });
  });
});
function openLightbox(src, caption) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-caption').textContent = caption;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(e) {
  if (e.target.id === 'lightbox' || e.target.classList.contains('close')) {
    document.getElementById('lightbox').classList.remove('open');
  }
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});
</script>
