<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact &mdash; JZ Photography</title>
  <style>

  @import url('https://fonts.googleapis.com/css2?family=Castoro+Titling&family=Montserrat:wght@300;400;500;600&display=swap');

:root {
    --bg: #0a0a0a;
  --ink: #fff;
      --ink-dim: rgba(255,255,255,0.72);
  --line: rgba(255,255,255,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    background: var(--bg);
  color: var(--ink);
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
}
.display { font-family: 'Castoro Titling', serif; font-weight: 400; }

@font-face {
    font-family: 'Ponpewd Signature';
  src: url('fonts/PonpewdSignature.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
.signature { font-family: 'Ponpewd Signature', cursive; font-weight: 200; }

/* social icons */
.social-icons {
    display: flex; align-items: center; justify-content: center;
  gap: 18px;
  margin: 6px 0 20px;
}
.social-icons a {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--ink);
  opacity: 0.82;
    text-decoration: none;
  transition: opacity 0.2s, border-color 0.2s;
}
.social-icons a:hover { opacity: 1; border-color: var(--ink); }
.social-icons svg {
  width: 15px; height: 15px;
  fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}

/* nav */
header.site-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
    padding: 26px 42px;
  background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
}
header.site-nav .wordmark {
      font-family: 'Castoro Titling', serif;
  font-size: 20px;
  letter-spacing: 0.04em;
  color: var(--ink);
  text-decoration: none;
}
header.site-nav nav { display: flex; gap: 30px; }
header.site-nav nav a {
  color: var(--ink);
      text-decoration: none;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.85;
    transition: opacity 0.2s;
    }
    header.site-nav nav a:hover, header.site-nav nav a.active { opacity: 1; border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
@media (max-width: 700px) {
      header.site-nav { padding: 18px 20px; }
  header.site-nav nav { gap: 16px; }
  header.site-nav nav a { font-size: 9px; letter-spacing: 0.1em; }
}

footer.site-footer {
  text-align: center;
  padding: 70px 24px 50px;
      border-top: 1px solid var(--line);
  color: var(--ink-dim);
  font-size: 12px;
      letter-spacing: 0.04em;
}
footer.site-footer .wordmark { font-family: 'Castoro Titling', serif; font-size: 18px; color: var(--ink); margin-bottom: 10px; letter-spacing: 0.04em; }
footer.site-footer a { color: var(--ink-dim); text-decoration: none; }
footer.site-footer a:hover { color: var(--ink); }

.page-header {
    padding: 150px 24px 20px;
  text-align: center;
}
.page-header h1 {
    font-size: clamp(34px, 5vw, 56px);
  letter-spacing: 0.02em;
}
.page-header p {
    color: var(--ink-dim);
  margin-top: 14px;
  font-size: 14px;
  max-width: 480px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.6;
}
.contact-wrap {
    max-width: 620px;
  margin: 0 auto;
  padding: 30px 24px 110px;
}
.contact-form label {
    display: block;
  margin-bottom: 22px;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.contact-form input, .contact-form textarea {
    width: 100%;
  margin-top: 8px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 12px 14px;
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  letter-spacing: 0.02em;
  border-radius: 2px;
}
.contact-form input:focus, .contact-form textarea:focus {
    outline: none;
  border-color: var(--ink);
}
.contact-form textarea {
    resize: vertical;
  min-height: 120px;
  font-family: 'Montserrat', sans-serif;
}
.contact-form button[type="submit"] {
  display: inline-block;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  padding: 14px 34px;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.25s, color 0.25s;
  font-family: 'Montserrat', sans-serif;
}
.contact-form button[type="submit"]:hover { background: var(--ink); color: #000; }
.contact-form button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
.form-status {
    margin-top: 18px;
  font-size: 13px;
  letter-spacing: 0.03em;
  min-height: 18px;
}
.form-status.success { color: #8fd19e; }
.form-status.error { color: #e28b8b; }
</style>
  </head>
  <body>

  <header class="site-nav">
    <a class="wordmark" href="index.html">Jeremy Zimmer</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="https://jeremy-zimmer.pixels.com/" target="_blank" rel="noopener">Prints</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <div class="page-header">
    <h1 class="display">Contact</h1>
    <p>Questions about prints, licensing, or a specific shot? Send a message below and I will get back to you.</p>
  </div>

  <main class="contact-wrap">
    <form id="contact-form" class="contact-form" action="https://formsubmit.co/ajax/jeremiah.w.zimmer@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New message from JZ Photography website">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Message
        <textarea name="message" rows="6" required></textarea>
      </label>
      <button type="submit">Send Message</button>
      <p id="form-status" class="form-status" role="status"></p>
    </form>
  </main>

<footer class="site-footer">
    <div class="wordmark">JZ Photography</div>
    <div class="social-icons"><a href="https://www.instagram.com/jz_pics/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="0.9" fill="currentColor" stroke="none"/></svg></a><a href="https://www.facebook.com/jz.photoz" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14 8.5h-1.6c-.9 0-1.4.6-1.4 1.5v2h3l-.4 3h-2.6v6"/></svg></a><a href="https://www.youtube.com/@JZ_Pics" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M10.3 9.4v5.2l4.4-2.6z" fill="currentColor" stroke="none"/></svg></a><a href="https://www.tiktok.com/@surviving_homestead" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24"><path d="M13 3v11.4a2.9 2.9 0 1 1-2.9-2.9"/><path d="M13 3c.3 2.6 2.1 4.4 4.6 4.7"/></svg></a><a href="https://jeremy-zimmer.pixels.com/" target="_blank" rel="noopener" aria-label="Pixels — Prints"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.6" fill="currentColor" stroke="none"/><path d="M3 16l5.5-5 4 4 3-3 5.5 5.5"/></svg></a></div>
  <div>&copy; Jeremy Zimmer. All images protected under copyright.</div>
</footer>

<script>
  document.getElementById('contact-form').addEventListener('submit', function(e) {
    e.preventDefault();
  var form = e.target;
  var status = document.getElementById('form-status');
  var btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  fetch(form.action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
    }).then(function(r) {
        if (r.ok) {
      status.textContent = "Thanks — your message has been sent. I'll get back to you soon.";
      status.className = 'form-status success';
      form.reset();
        } else {
      status.textContent = 'Something went wrong. Please try again or email directly.';
      status.className = 'form-status error';
        }
  }).catch(function() {
    status.textContent = 'Something went wrong. Please try again or email directly.';
    status.className = 'form-status error';
  }).finally(function() {
        btn.disabled = false;
    btn.textContent = 'Send Message';
  });
});
</script>

  </body>
  </html>
